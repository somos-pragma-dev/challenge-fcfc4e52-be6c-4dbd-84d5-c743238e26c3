name: payment_app
description: A payment application with offline persistence and synchronization capabilities.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  drift: ^2.22.1
  sqlite3_flutter_libs: ^0.5.28
  path_provider: ^2.1.5
  path: ^1.9.1
  dio: ^5.7.0
  connectivity_plus: ^6.1.1
  get_it: ^8.0.3
  uuid: ^4.5.1
  equatable: ^2.0.7
  dartz: ^0.10.1
  flutter_secure_storage: ^9.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  drift_dev: ^2.22.1
  build_runner: ^2.4.14
  mockito: ^5.4.4
  riverpod_generator: ^2.6.3

flutter:
  uses-material-design: true